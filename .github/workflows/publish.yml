name: Publish to npm

# Publishing is tied to a GitHub release rather than to a push, so every
# version on npm corresponds to a tag somebody deliberately cut, and the
# release page is the changelog. workflow_dispatch is the escape hatch for
# re-running a failed publish without inventing a second tag.
on:
  release:
    types: [published]
  workflow_dispatch:

# Never let two publishes race: npm will reject the second, but the failure
# is confusing and the half-run leaves a release looking published.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the credential now. npm exchanges the OIDC token GitHub mints
      # here for a short-lived publish grant, so there is no NPM_TOKEN to leak,
      # rotate, or forget to revoke. Provenance signing needs it too.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0. Floor, not preference.
          node-version: 22
          cache: npm
          # Makes npm write an .npmrc pointing at the public registry, which is
          # the registry npm then presents the OIDC token to.
          registry-url: https://registry.npmjs.org

      # Trusted publishing also requires npm >= 11.5.1, and Node 22 ships npm
      # 10. Skipping this does not fail loudly: npm falls back to looking for a
      # token it does not have and reports 404 / ENEEDAUTH, which reads like a
      # permissions problem on the package rather than a version problem in the
      # runner. See npm/cli#9088.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publishing an untested build is how a broken release reaches people
      # who then have to work out whether it is them or us.
      - run: npm test

      - run: npm run typecheck

      # `prepublishOnly` also builds, but doing it here means a build failure
      # is its own red step rather than buried in publish output.
      - run: npm run build

      # The tag is the only claim about what version this is, and package.json
      # is the only thing npm actually reads. If they disagree, the release
      # notes describe a version nobody can install. Cheaper to fail here.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $TAG but package.json says $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      # No token and no --provenance flag, and both absences are the point.
      #
      # npm authenticates this publish by exchanging the workflow's OIDC token
      # with the registry, against a trusted publisher registered on the package
      # that names this repository and this workflow file. Renaming this file or
      # moving the job to another repo breaks publishing until the publisher is
      # re-registered, which is the trade for holding no long-lived credential.
      #
      # Provenance is emitted automatically under trusted publishing, so the
      # signed attestation tying this tarball to this commit survives the switch.
      # Passing --provenance here would be redundant, not additive.
      #
      # Access is declared in package.json's publishConfig rather than passed
      # here, so a local `npm publish` behaves the same way. A scoped package
      # defaults to restricted and would otherwise fail on a free account.
      - name: Publish
        run: npm publish
